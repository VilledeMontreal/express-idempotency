name: CI

# Build, lint and test on GitHub Actions. npm publishing is handled by the
# separate release.yml workflow, triggered on version tags and using OIDC
# trusted publishing (no long-lived npm token).

on:
  push:
    branches:
      - '**'
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run prettier

      - name: Compile
        run: npm run compile

      - name: Test (unit + coverage)
        run: npm test

      - name: E2E tests
        run: npm run test:e2e

      # Coverage upload runs only on pushes to the upstream repo: secrets are not
      # exposed to fork PRs, and the token is absent on personal forks. It never
      # fails the build (continue-on-error) so a missing/expired token stays soft.
      - name: Upload coverage to Codacy
        if: ${{ github.event_name == 'push' && github.repository == 'VilledeMontreal/express-idempotency' }}
        continue-on-error: true
        uses: codacy/codacy-coverage-reporter-action@89d6c85cfafaec52c72b6c5e8b2878d33104c699 # v1.3.0
        with:
          project-token: ${{ secrets.CODACY_PROJECT_TOKEN }}
          coverage-reports: coverage/lcov.info
